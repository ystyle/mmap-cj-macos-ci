name: macOS CI

on:
  push:
  workflow_dispatch:

jobs:
  test-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14]   # x86_64 (Intel) + arm64 (Apple Silicon)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cangjie toolchain
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: auto            # 从 cjpm.toml 读取 cjc-version = "1.1.0"

      - name: Test (os.darwin)
        run: cjpm test --enable-features=os.darwin
