name: macOS CI

on:
  push:
  workflow_dispatch:

jobs:
  test-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]   # arm64 (Apple Silicon) + x86_64 (Intel)
                                         # macos-13 已进入退役期、长期排队，改用 macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cangjie toolchain
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: auto            # 从 cjpm.toml 读取 cjc-version = "1.1.0"

      - name: Test (os.darwin)
        run: cjpm test            # @When[os == "macOS"] 自动选中 darwin 实现，无需 enable-features
