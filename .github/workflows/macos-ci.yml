name: macOS CI

on:
  push:
  workflow_dispatch:

jobs:
  test-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]           # 仓颉 SDK 自 1.0.0 起只发布 darwin-aarch64：
                                 # darwin-x64 仅存在于 0.53.x 与 1.1.0-beta.*，
                                 # 因此 macOS 只能在 Apple Silicon runner 上验证
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cangjie toolchain
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: auto            # 从 cjpm.toml 读取 cjc-version = "1.1.0"

      - name: Test (os.darwin)
        run: cjpm test            # @When[os == "macOS"] 自动选中 darwin 实现，无需 enable-features
